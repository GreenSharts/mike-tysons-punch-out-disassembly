<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NES Punchout - JS Port</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    canvas {
      width: 512px;
      height: 480px;
      background-color: #000;
      border: 4px solid #444;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      image-rendering: pixelated; /* Essential for sharp 8-bit graphics */
    }
    .controls {
      margin-top: 20px;
      text-align: center;
    }
    .key {
      display: inline-block;
      padding: 5px 10px;
      background-color: #444;
      border-radius: 4px;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <h1>NES Punchout - Web Port (Work in Progress)</h1>
  <canvas id="game-canvas" width="256" height="240"></canvas>
  <div class="controls">
    <p>Controls:</p>
    <p>
      <span class="key">Arrows</span> Move
    </p>
  </div>

  <script>
    // Global Game State
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");

    const game = {
      x: 120,
      y: 180,
      speed: 2,
      keys: {}
    };

    // Load Sprite image (generated by our Python tool)
    const spriteImg = new Image();
    spriteImg.src = "sprite.png";

    // Input Handling
    window.addEventListener("keydown", (e) => { game.keys[e.key] = true; });
    window.addEventListener("keyup", (e) => { game.keys[e.key] = false; });

    function update() {
      if (game.keys["ArrowLeft"]) game.x -= game.speed;
      if (game.keys["ArrowRight"]) game.x += game.speed;
      if (game.keys["ArrowUp"]) game.y -= game.speed;
      if (game.keys["ArrowDown"]) game.y += game.speed;

      // Basic Bounds
      game.x = Math.max(0, Math.min(256 - 16, game.x));
      game.y = Math.max(0, Math.min(240 - 32, game.y));
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, 256, 240);

      // Draw sprite if loaded, otherwise fallback rectangle
      if (spriteImg.complete && spriteImg.naturalHeight !== 0) {
        // Draw the extracted sprite image
        ctx.drawImage(spriteImg, game.x, game.y);
      } else {
        ctx.fillStyle = "#FF0000"; // Red placeholder
        ctx.fillRect(game.x, game.y, 16, 32);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Start game loop
    spriteImg.onload = () => requestAnimationFrame(gameLoop);
    // Fallback if image fails to load
    spriteImg.onerror = () => requestAnimationFrame(gameLoop);

  </script>
</body>
</html>
